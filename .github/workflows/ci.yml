name: CI
# Runs the pipeline end to end on the synthetic test data (-profile test) with conda
on:
  push:
    branches:
      - main
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

env:
  NXF_ANSI_LOG: false
  NXF_CONDA_CACHEDIR: ${{ github.workspace }}/.conda-envs

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: "Test profile (Nextflow ${{ matrix.NXF_VER }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        NXF_VER:
          - "23.04.0" # oldest supported version, see manifest.nextflowVersion
          - "latest-stable"
    defaults:
      run:
        # Login shell so the conda set up by setup-miniconda is on PATH
        shell: bash -el {0}
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          conda-remove-defaults: true

      # Nextflow 23.04 does not run on Java 21 or later
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "${{ matrix.NXF_VER }}"

      - name: Cache conda environments
        uses: actions/cache@v4
        with:
          path: ${{ env.NXF_CONDA_CACHEDIR }}
          key: conda-envs-${{ runner.os }}-${{ hashFiles('modules/**/environment.yml') }}

      - name: Run pipeline with test data
        run: |
          nextflow run ${GITHUB_WORKSPACE} -profile test,conda --outdir ./results

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-nextflow-${{ matrix.NXF_VER }}
          path: |
            .nextflow.log
            work/**/.command.*
          include-hidden-files: true
